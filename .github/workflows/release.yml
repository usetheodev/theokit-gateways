name: Release

# theokit-gateways: gateway core + 10 platform adapters. Changesets-driven
# per-package release. Auth via NPM_TOKEN (NODE_AUTH_TOKEN). Provenance disabled
# while the source repo is private (npm E422) — re-enable when public.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release via Changesets (gateways)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Publishing used to be reachable without the suite ever running: this job
      # went install -> build -> publish, and no workflow anywhere invoked
      # `pnpm test`. `ci.yml` now gates the PR into main, but this step is what
      # makes it impossible for a release to outrun a red suite — a manual
      # `workflow_dispatch` bypasses the PR gate, and this one it cannot bypass.
      - name: Test before publishing
        run: pnpm -r run test

      # The changesets action creates a "Version Packages" commit, and `prepare`
      # points core.hooksPath at .githooks — so the repository's pre-commit
      # secret gate runs here too. That gate is fail-closed by design: without
      # the binary it aborts rather than waving the commit through. Installing
      # it keeps the gate real in CI instead of switching it off, which is the
      # whole point of a gate that refuses to disable itself.
      #
      # Pinned to the version secret-scan.yml uses, so both paths scan alike.
      - name: Install TruffleHog for the pre-commit gate
        run: |
          set -euo pipefail
          VERSION=3.97.0
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/trufflehog_${VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp trufflehog
          sudo install -m 0755 /tmp/trufflehog /usr/local/bin/trufflehog
          trufflehog --version
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
