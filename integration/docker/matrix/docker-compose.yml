# A real Matrix homeserver, for the live suite.
#
# Matrix is the one platform here with no hosted account to create: matrix.org
# answers registration with "Only m.login.application_service registrations are
# allowed", and every other public homeserver tried (tchncs.de, matrix.im,
# mozilla.modular.im) has closed registration too.
#
# That turns out to be the better path rather than a workaround. Matrix is
# federated by design and most deployments are self-hosted, so a real homeserver
# IS the platform — unlike Slack or Discord, which exist only as SaaS. This
# suite therefore needs no credential, no secret and no human: it boots a server,
# provisions two accounts, and tears the whole thing down.
#
# Continuwuity rather than Synapse: one container, no config generation step,
# and it answers /_matrix/client/versions about a second after start. Synapse
# needs a generate pass and a good deal longer, which is a poor trade for a
# server that exists for the length of a test run.

services:
  homeserver:
    image: ghcr.io/continuwuity/continuwuity:latest
    container_name: theokit-integration-matrix
    environment:
      CONTINUWUITY_SERVER_NAME: localhost
      CONTINUWUITY_DATABASE_PATH: /var/lib/conduwuit/conduwuit.db
      CONTINUWUITY_PORT: "6167"
      CONTINUWUITY_ADDRESS: "0.0.0.0"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: theokit-integration
      # No federation: this server talks to nothing outside the test.
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_TRUSTED_SERVERS: "[]"
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: "false"
      CONTINUWUITY_LOG: "warn,conduwuit=info"
    ports:
      # Bound to loopback: nothing here should be reachable from the network.
      - "127.0.0.1:${MATRIX_HOST_PORT:-26167}:6167"
    # No healthcheck. The obvious one — a /dev/tcp probe — needs bash, and this
    # image is minimal enough not to have it, so `--wait` reports the container
    # unhealthy while the server is answering perfectly well. The bootstrap
    # script polls /_matrix/client/versions over HTTP instead, which is what
    # "ready" actually means here and does not care what is inside the image.
