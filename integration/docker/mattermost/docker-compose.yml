# A real Mattermost server, for the live suite.
#
# Same reasoning as the Matrix homeserver next door: Mattermost is
# self-hosted software, so a real server IS the platform rather than a stand-in
# for one. There is no hosted free tier to point a test at, and none is needed.
#
# `mattermost-preview` bundles its own database and starts with an empty
# instance, which is what a test wants: the first account created through the API
# becomes the system admin, so the whole fixture can be provisioned with no
# console and no human. The trade is boot time — this takes tens of seconds where
# Continuwuity takes one, so the bootstrap polls patiently.

services:
  mattermost:
    image: mattermost/mattermost-preview:latest
    container_name: theokit-integration-mattermost
    environment:
      # Personal access tokens are off by default and are what the adapter
      # authenticates with, so the server is asked to allow them up front.
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      # An empty instance with open signup: the fixture creates its own accounts.
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
    ports:
      # Loopback only — nothing here should be reachable from the network.
      - "127.0.0.1:${MATTERMOST_HOST_PORT:-28065}:8065"
